name: Build Android APKs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APKs
        run: gradle --no-daemon clean :pixel-transmitter:assembleDebug :fire-receiver:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gps-transmitter-debug
          path: pixel-transmitter/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gps-receiver-debug
          path: fire-receiver/build/outputs/apk/debug/*.apk
