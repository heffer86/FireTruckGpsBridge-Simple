name: Build Android APKs

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build both debug APKs
        run: gradle --no-daemon clean :pixel-transmitter:assembleDebug :fire-receiver:assembleDebug

      - name: Rename APKs
        run: |
          mkdir -p artifacts
          cp pixel-transmitter/build/outputs/apk/debug/pixel-transmitter-debug.apk artifacts/GPS-Transmitter-debug.apk
          cp fire-receiver/build/outputs/apk/debug/fire-receiver-debug.apk artifacts/GPS-Receiver-debug.apk

      - name: Upload transmitter APK
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Transmitter-debug
          path: artifacts/GPS-Transmitter-debug.apk
          if-no-files-found: error

      - name: Upload receiver APK
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Receiver-debug
          path: artifacts/GPS-Receiver-debug.apk
          if-no-files-found: error
